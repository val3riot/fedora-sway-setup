# workstation-setup: managed Fuzzel config
[main]
font=CaskaydiaMono Nerd Font:size=13
prompt="  "
placeholder=Cerca applicazioni…
icon-theme=default
icons-enabled=yes
fields=filename,name,generic,keywords,comment
show-actions=yes
match-mode=fzf
width=48
lines=8
line-height=42
horizontal-pad=24
vertical-pad=18
inner-pad=12
image-size-ratio=1
layer=overlay
anchor=center
match-counter=no

[border]
width=2
radius=14
selection-radius=8
