# workstation-setup: managed Fuzzel config
[main]
font=CaskaydiaMono Nerd Font:size=12
prompt="  "
placeholder=Cerca applicazioni…
icon-theme=default
icons-enabled=yes
fields=filename,name,generic,keywords,comment
show-actions=yes
match-mode=fzf
width=44
lines=8
line-height=38
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=1
layer=overlay
anchor=center
match-counter=no

[border]
width=2
radius=14
selection-radius=8
