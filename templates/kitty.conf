# workstation-setup: managed kitty config
# Kitty renders the terminal; tmux owns sessions, windows and panes.

font_family      monospace
font_size        11.5
disable_ligatures cursor

include theme.conf
cursor_shape     block
cursor_blink_interval 0
window_padding_width 8
background_opacity 0.92

scrollback_lines 20000
wheel_scroll_multiplier 3.0
url_style single
open_url_with default
detect_urls yes
copy_on_select no
clipboard_control write-clipboard write-primary read-clipboard-ask
enable_audio_bell no
confirm_os_window_close 0
shell zsh

# Keep Ctrl+b and ordinary tmux keys untouched. Kitty owns only GUI operations.
map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+u kitten hints --type url
