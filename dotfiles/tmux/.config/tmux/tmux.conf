# workstation-setup: managed tmux config
# Standard prefix retained: C-b

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB:clipboard'
set -as terminal-features ',xterm-256color:RGB'
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 10
set -g focus-events on
set -g status-interval 10

setw -g automatic-rename on
set -g allow-rename off
set -g status-position bottom
set -g status-style 'bg=#2b3038,fg=#c6ccd5'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=#88c0d0,bold] #S #[default]'
set -g status-right '#[fg=#737b87]#H #[fg=#d0aa72]%H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#1f2329,bg=#8eaf72,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#78aeb3'
set -g message-style 'bg=#d0aa72,fg=#1f2329'

# Additions remain prefix-based and close to stock tmux concepts.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind c new-window -c '#{pane_current_path}'
bind s choose-tree -s

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
