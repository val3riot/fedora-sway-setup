# workstation-setup: managed system utility windows
# Reserved IDs only. Kitty supplies an output-bounded initial size via the helper.
# Ordinary Kitty and normal applications remain tiled; inherit the Sway border theme.
for_window [app_id="^workstation-(bluetooth|audio|network|storage|system-monitor|system-tool)$"] floating enable, fullscreen disable, move position center
# GTK portal exposes this dedicated ID for temporary file choosers only.
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable, resize set width 800 height 600, move position center
