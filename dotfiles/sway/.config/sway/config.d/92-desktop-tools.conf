# workstation-setup: managed Quickshell desktop keys
bindsym --no-warn $mod+d exec $HOME/.local/bin/workstation-shell launcher
bindsym --no-warn $mod+g exec $HOME/.local/bin/workstation-shell shortcuts
bindsym --no-warn $mod+v exec $HOME/.local/bin/workstation-shell clipboard
# Preserve vertical split after assigning clipboard to Mod+v.
bindsym --no-warn $mod+Shift+v splitv
bindsym --no-warn Print exec $HOME/.local/bin/workstation-screenshot area
bindsym --no-warn Shift+Print exec $HOME/.local/bin/workstation-screenshot output
bindsym --no-warn $mod+Print exec $HOME/.local/bin/workstation-screenshot window
bindsym --no-warn XF86AudioRaiseVolume exec $HOME/.local/bin/workstation-shell volume-up
bindsym --no-warn XF86AudioLowerVolume exec $HOME/.local/bin/workstation-shell volume-down
bindsym --no-warn XF86AudioMute exec $HOME/.local/bin/workstation-shell mute
bindsym --no-warn XF86AudioMicMute exec $HOME/.local/bin/workstation-shell mic-mute
bindsym --no-warn XF86MonBrightnessUp exec $HOME/.local/bin/workstation-shell brightness-up
bindsym --no-warn XF86MonBrightnessDown exec $HOME/.local/bin/workstation-shell brightness-down
